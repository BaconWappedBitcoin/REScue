<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>REScue</title>
  <!-- A life ring (the "rescue") around an old-style upvote arrow. Original artwork, GPL-3.0-or-later. -->
  <defs>
    <radialGradient id="shade" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ring: white body, four coral bands -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#fdfaf5" stroke-width="30"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#f0532d" stroke-width="30"
          stroke-dasharray="40.5 28.6" transform="rotate(-22.5 64 64)"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#shade)" stroke-width="30"/>
  <!-- rope ties across each white band -->
  <g stroke="#1d2b4f" stroke-width="3.5" stroke-linecap="round">
    <path d="M90.9 90.9 L99.4 99.4 M37.1 90.9 L28.6 99.4 M37.1 37.1 L28.6 28.6 M90.9 37.1 L99.4 28.6"/>
  </g>
  <!-- outlines -->
  <circle cx="64" cy="64" r="59" fill="none" stroke="#1d2b4f" stroke-width="4"/>
  <circle cx="64" cy="64" r="29" fill="#1d2b4f" stroke="#1d2b4f" stroke-width="4"/>
  <!-- the upvote arrow -->
  <path d="M64 41 L84 62 L73 62 L73 85 L55 85 L55 62 L44 62 Z" fill="#f0532d" stroke="#fdfaf5" stroke-width="3" stroke-linejoin="round"/>
</svg>
