<div class="max-w-[360px] w-[90vw] overflow-hidden p-0 -m-xs">
  <div class="flex flex-col">
    <div class="ps-sm pe-sm pt-sm flex items-center">
      <span class="w-2xl h-2xl text-24 shrink-0">
        <span
          class="inline-flex items-center justify-center w-2xl h-2xl relative"
          rpl
          avatar
          data-no-rtl-mirror
        >
          <span
            rpl
            class="inline-block rounded-full relative [&>:first-child]:h-full [&>:first-child]:w-full [&>:first-child]:mb-0 [&>:first-child]:rounded-[inherit] h-full w-full [&>:first-child]:overflow-hidden [&>:first-child]:max-h-full"
          >
            <img
              src="https://styles.redditmedia.com/t5_2fwo/styles/communityIcon_1bqa1ibfp8q11.png?width=64&amp;frame=1&amp;auto=webp&amp;s=2545f3c0332e412c8635f5f2a5868c0e857ef040"
              alt=""
              class="mb-0 shreddit-subreddit-icon__icon rounded-full overflow-hidden nd:visible nd:bg-secondary-background w-full h-full"
              width="48"
              style="color: #002b36; background: #002b36; width: 48px"
              loading="lazy"
            /> </span
        ></span>
      </span>
      <span class="flex ms-xs grow-0 w-100">
        <faceplate-tracker source="subreddit_hovercard" action="click" noun="title">
          <a
            rpl
            class="text-18 font-bold text-neutral-content-strong leading-6 a text-body-2 no-visited hover:underline cursor-pointer"
            href="/r/programming/"
            >r/programming</a
          >
        </faceplate-tracker>
      </span>
      <faceplate-tracker
        class="ms-auto"
        source="subreddit_hovercard"
        action="click"
        noun="join_signup_cta"
      >
        <shreddit-join-button
          subreddit-id="t5_2fwo"
          name="programming"
          buttonsize="x-small"
          button-type="secondary"
        ></shreddit-join-button>
      </faceplate-tracker>
    </div>
    <p class="ps-md pe-md pt-md m-0 whitespace-normal text-14 leading-5 font-normal">
      Computer Programming
    </p>
    <hr class="ms-md me-md mt-md border-neutral-border-weak" />
    <div class="ps-md pe-md py-md flex items-center">
      <span class="flex flex-col">
        <span class="text-14 text-neutral-content leading-5 font-semibold">
          <faceplate-number number="202086" pretty></faceplate-number>
        </span>
        <span class="text-12 leading-4 text-neutral-content-weak">Weekly visitors</span>
      </span>
      <span data-testid="community-hover-card:active-count" class="ms-xl flex flex-col">
        <span class="text-14 text-neutral-content leading-5 font-semibold">
          <faceplate-number number="1921" pretty></faceplate-number>
        </span>
        <span class="flex items-center">
          <span class="text-12 leading-4 text-neutral-content-weak"> Weekly contributions </span>
        </span>
      </span>
    </div>
  </div>
</div>
